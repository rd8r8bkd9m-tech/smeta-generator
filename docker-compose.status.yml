version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: status-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-status}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-status_secret}
      POSTGRES_DB: ${POSTGRES_DB:-status_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-status}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - status-network

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: status-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - status-network

  # API Server
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: status-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-status}:${POSTGRES_PASSWORD:-status_secret}@postgres:5432/${POSTGRES_DB:-status_db}?schema=public
      NODE_ENV: production
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-status-app-media}
      S3_FORCE_PATH_STYLE: "true"
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - status-network

  # Mobile Web App
  mobile-web:
    build:
      context: .
      dockerfile: docker/mobile-web.Dockerfile
      args:
        VITE_API_URL: ${API_URL:-http://localhost:4000/api}
    container_name: status-mobile-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - status-network

  # Create MinIO bucket on startup
  minio-setup:
    image: minio/mc:latest
    container_name: status-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing myminio/${S3_BUCKET_NAME:-status-app-media};
      mc anonymous set public myminio/${S3_BUCKET_NAME:-status-app-media};
      exit 0;
      "
    networks:
      - status-network

volumes:
  postgres_data:
  minio_data:

networks:
  status-network:
    driver: bridge
